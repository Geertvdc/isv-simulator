# Deploys the game and the game server to Azure. Run by hand only:
# Actions > Deploy > Run workflow. See infra/README.md.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options:
          - prod
        default: prod
      shards:
        description: Game server shards; default is gameServerShards in infra/main.bicepparam (change it there to keep a count). 1, 2, 3, 4, 6 or 8 spread rooms evenly
        type: choice
        options:
          - default
          - '1'
          - '2'
          - '3'
          - '4'
          - '6'
          - '8'
        default: default
      what_if:
        description: What-if only (show the infrastructure changes, deploy nothing)
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          SHARDS: ${{ inputs.shards }}
          WHAT_IF: ${{ inputs.what_if }}
        run: |
          args=(--env "$DEPLOY_ENV")
          if [[ -n "$SHARDS" && "$SHARDS" != default ]]; then
            args+=(--shards "$SHARDS")
          fi
          if [[ "$WHAT_IF" == "true" ]]; then
            args+=(--what-if)
          fi
          infra/scripts/deploy.sh "${args[@]}"
